name: Kit CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
          - name: Linux amd64
            os: ubuntu-24.04
            go-flags: "-tags=webkit2_41"
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: ${{ matrix.go-flags }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-bin

      - name: Test
        run: go test -race -count=1 ./...

      - name: Debian control metadata smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_root="$(mktemp -d)"
          trap 'rm -rf "$deb_root"' EXIT
          install -Dm755 /bin/true "$deb_root/usr/bin/desktopkit-deb-smoke"
          mkdir -p "$deb_root/DEBIAN"
          {
            echo "Package: desktopkit-deb-smoke"
            echo "Version: 0.0.0~ci"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: desktopkit-ci"
            echo "Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0"
            printf 'Description: %s\n' "Desktop Kit Debian packaging smoke"
          } > "$deb_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$deb_root" /tmp/desktopkit-deb-smoke.deb
          dpkg-deb --info /tmp/desktopkit-deb-smoke.deb >/dev/null

      - name: macOS Wails and tray lifecycle smoke
        if: runner.os == 'macOS'
        # Match the framework linked by Wails' macOS build command.
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: go run -tags production ./.github/smokeapp
        timeout-minutes: 2

      - name: Vet
        run: go vet ./...

      - name: Linux packaging smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/packaging-smoke
          mkdir -p .tmp/packaging-smoke/dist

          go build -o .tmp/packaging-smoke/desktopkit-smoke ./cmd/desktopkit
          go run ./cmd/desktopkit icon generate             --output .tmp/packaging-smoke/icon.png             --symbol monogram             --text K

          cat > .tmp/packaging-smoke/desktopkit-smoke.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Desktop Kit Packaging Smoke
          Exec=desktopkit-smoke
          Icon=desktopkit-smoke
          Terminal=false
          Categories=Utility;
          EOF

          go run ./cmd/desktopkit package linux             --input .tmp/packaging-smoke/desktopkit-smoke             --dist .tmp/packaging-smoke/dist             --app-name desktopkit-smoke             --asset-base desktopkit-smoke-v0.0.0             --package-name desktopkit-smoke             --package-version 0.0.0             --formats raw,deb,tar.gz             --description "Desktop Kit packaging smoke"             --maintainer "Desktop Kit CI"             --depends "libgtk-3-0 | libgtk-3-0t64"             --desktop-file .tmp/packaging-smoke/desktopkit-smoke.desktop             --icon .tmp/packaging-smoke/icon.png

          test -x .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64
          tar -tzf .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.tar.gz | grep -F 'desktopkit-smoke-v0.0.0-linux-amd64/desktopkit-smoke'
          dpkg-deb --info .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.deb
          dpkg-deb --contents .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.deb | grep -F './usr/bin/desktopkit-smoke'
          (
            cd .tmp/packaging-smoke/dist
            sha256sum --check *.sha256
          )

      - name: Linux packaging smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          printf '#!/bin/sh\necho demo\n' > "$root/demo"
          chmod +x "$root/demo"
          cat > "$root/demo.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Demo
          Exec=demo
          Icon=demo
          Categories=Utility;
          EOF
          go run ./cmd/desktopkit package linux \
            --input "$root/demo" \
            --dist "$root/dist" \
            --app-name demo \
            --asset-base demo-v1.2.3 \
            --package-name demo \
            --package-version 1.2.3 \
            --formats raw,deb,tar.gz \
            --description "Desktop Kit packaging smoke" \
            --maintainer "Desktop Kit CI" \
            --desktop-file "$root/demo.desktop"

          test -x "$root/dist/demo-v1.2.3-linux-amd64"
          tar -tzf "$root/dist/demo-v1.2.3-linux-amd64.tar.gz" | grep -F 'demo-v1.2.3-linux-amd64/demo'
          dpkg-deb --info "$root/dist/demo-v1.2.3-linux-amd64.deb"
          dpkg-deb --contents "$root/dist/demo-v1.2.3-linux-amd64.deb" | grep -F './usr/bin/demo'
          (
            cd "$root/dist"
            sha256sum --check ./*.sha256
          )
