name: Kit CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
          - name: Linux amd64
            os: ubuntu-24.04
            go-flags: "-tags=webkit2_41"
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: ${{ matrix.go-flags }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-bin

      - name: Test
        run: go test -race -count=1 ./...

      - name: Debian control metadata smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_root="$(mktemp -d)"
          trap 'rm -rf "$deb_root"' EXIT
          install -Dm755 /bin/true "$deb_root/usr/bin/desktopkit-deb-smoke"
          mkdir -p "$deb_root/DEBIAN"
          {
            echo "Package: desktopkit-deb-smoke"
            echo "Version: 0.0.0~ci"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: desktopkit-ci"
            echo "Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0"
            printf 'Description: %s\n' "Desktop Kit Debian packaging smoke"
          } > "$deb_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$deb_root" /tmp/desktopkit-deb-smoke.deb
          dpkg-deb --info /tmp/desktopkit-deb-smoke.deb >/dev/null

          # Test the actual Kit-generated .deb, including paths introduced in
          # the v0.10.2/v0.10.3 maintenance line.
          printf '<component><id>io.example.desktopkit-smoke</id></component>\n' > "$deb_root/smoke.metainfo.xml"
          printf 'Example test license\n' > "$deb_root/COPYRIGHT"
          go run ./cmd/desktopkit package linux \
            --input /bin/true \
            --dist "$deb_root/out" \
            --app-name desktopkit-deb-smoke \
            --asset-base desktopkit-deb-smoke \
            --package-version 0.0.0 \
            --description "Desktop Kit packaging smoke" \
            --maintainer desktopkit-ci \
            --formats deb \
            --systemd \
            --service-env "PORT=8610" \
            --service-environment-file "/etc/default/desktopkit-deb-smoke" \
            --appstream-file "$deb_root/smoke.metainfo.xml" \
            --copyright-file "$deb_root/COPYRIGHT"
          kit_deb="$deb_root/out/desktopkit-deb-smoke-linux-amd64.deb"
          dpkg-deb --info "$kit_deb"
          dpkg-deb --contents "$kit_deb" >/dev/null
          dpkg-deb --extract "$kit_deb" "$deb_root/extracted"
          test -f "$deb_root/extracted/usr/bin/desktopkit-deb-smoke"
          test -f "$deb_root/extracted/lib/systemd/system/desktopkit-deb-smoke.service"
          test -f "$deb_root/extracted/usr/share/metainfo/io.example.desktopkit-smoke.metainfo.xml"
          test -f "$deb_root/extracted/usr/share/doc/desktopkit-deb-smoke/copyright"
          grep -F 'EnvironmentFile=-/etc/default/desktopkit-deb-smoke' "$deb_root/extracted/lib/systemd/system/desktopkit-deb-smoke.service"
          dpkg-deb --ctrl-tarfile "$kit_deb" | tar -xOf - ./control | grep -F 'Installed-Size:'

      - name: Real Debian systemd install / upgrade / remove / purge
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/systemd-deb-lifecycle.sh

      - name: macOS Wails and tray lifecycle smoke
        if: runner.os == 'macOS'
        # Match the framework linked by Wails' macOS build command.
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: go run -tags production ./.github/smokeapp
        timeout-minutes: 2

      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS",
              "${env:ProgramFiles}\NSIS"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path (Join-Path $candidate 'makensis.exe')) {
                $env:PATH = "$candidate;$env:PATH"
                break
              }
            }
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw 'makensis.exe is unavailable'
          }

          $root = Join-Path $env:RUNNER_TEMP 'desktopkit-windows-installer-smoke'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'dist') | Out-Null

          $input = Join-Path $root 'desktopkit-smoke.exe'
          go build -o $input ./.github/updater-installation-smoke

          go run ./cmd/desktopkit package windows `
            --input $input `
            --dist (Join-Path $root 'dist') `
            --app-name desktopkit-smoke `
            --asset-base desktopkit-smoke-v0.0.0 `
            --package-version 0.0.0 `
            --product-name "Desktop Kit Packaging Smoke" `
            --publisher "Desktop Kit CI" `
            --app-id "desktopkit-smoke" `
            --install-scope user

          $setup = Join-Path $root 'dist\desktopkit-smoke-v0.0.0-windows-amd64-setup.exe'
          if (-not (Test-Path $setup)) { throw "setup not created: $setup" }
          if (-not (Test-Path "$setup.sha256")) { throw "setup checksum not created" }

          $expectedHash = ((Get-Content "$setup.sha256" -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw "setup checksum mismatch" }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Desktop Kit Packaging Smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\desktopkit-smoke'
          Remove-Item $uninstallKey -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent install failed: $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'desktopkit-smoke.exe'
          if (-not (Test-Path $installedExe)) { throw 'installed executable missing' }
          if (-not (Test-Path $uninstallKey)) { throw 'uninstall registry key missing' }

          $installedState = (& $installedExe | ConvertFrom-Json)
          if ($installedState.Mode -ne 'user') { throw "installed probe mode was $($installedState.Mode)" }
          if ($installedState.InstallDir -ne $installDir) { throw "installed probe dir was $($installedState.InstallDir)" }
          if (-not $installedState.Uninstaller) { throw 'installed probe did not expose uninstaller' }

          $portableCopy = Join-Path $root 'desktopkit-smoke-portable.exe'
          Copy-Item $installedExe $portableCopy -Force
          $portableState = (& $portableCopy | ConvertFrom-Json)
          if ($portableState.Mode -ne 'portable') { throw "portable copy mode was $($portableState.Mode)" }
          if ($portableState.InstallDir) { throw "portable copy unexpectedly reported install dir $($portableState.InstallDir)" }

          $portableUpdate = Start-Process -FilePath $portableCopy -ArgumentList @('--apply-update', $setup) -Wait -PassThru
          if ($portableUpdate.ExitCode -eq 0) { throw 'portable updater unexpectedly accepted automatic install' }

          # A manual installer must never attempt to overwrite a running EXE.
          # Silent mode must fail deterministically instead of hanging on the NSIS Retry dialog.
          $beforeHash = (Get-FileHash $installedExe -Algorithm SHA256).Hash
          $runningApp = Start-Process -FilePath $installedExe -ArgumentList '--hold' -PassThru
          try {
            Start-Sleep -Milliseconds 500
            if ($runningApp.HasExited) { throw 'fixture exited before overwrite test' }
            $blocked = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($blocked.ExitCode -ne 3) { throw "running app must block silent setup with exit code 3, got $($blocked.ExitCode)" }
            $afterHash = (Get-FileHash $installedExe -Algorithm SHA256).Hash
            if ($beforeHash -ne $afterHash) { throw 'installer modified the running executable' }
          } finally {
            Stop-Process -Id $runningApp.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $runningApp.Id -ErrorAction SilentlyContinue
          }

          # Opt-in interactive package must compile with its bundled helper.
          go run ./cmd/desktopkit package windows `
            --input $input `
            --dist (Join-Path $root 'dist') `
            --app-name desktopkit-smoke `
            --asset-base desktopkit-smoke-confirm-close `
            --package-version 0.0.0 `
            --product-name "Desktop Kit Packaging Smoke" `
            --publisher "Desktop Kit CI" `
            --app-id "desktopkit-smoke" `
            --install-scope user `
            --confirm-stop-running=true
          if ($LASTEXITCODE -ne 0) { throw 'confirmed-close NSIS packaging failed' }
          if (-not (Test-Path (Join-Path $root 'dist/desktopkit-smoke-confirm-close-windows-amd64-setup.exe'))) {
            throw 'confirmed-close Setup not produced'
          }

          # Run the same tightly scoped close helper against CI-owned fixture only.
          # A second same-name EXE at a different path must prevent ALL shutdown.
          $otherDir = Join-Path $root 'other'
          New-Item -ItemType Directory -Force $otherDir | Out-Null
          $otherExe = Join-Path $otherDir 'desktopkit-smoke.exe'
          Copy-Item $installedExe $otherExe
          $targetApp = Start-Process -FilePath $installedExe -ArgumentList '--hold' -PassThru
          $otherApp = Start-Process -FilePath $otherExe -ArgumentList '--hold' -PassThru
          try {
            Start-Sleep -Milliseconds 600
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./packaging/windows_installer_stop.ps1 -InstallDir $installDir -ExeName 'desktopkit-smoke.exe'
            if ($LASTEXITCODE -ne 4) { throw "other-installation guard should fail closed, got $LASTEXITCODE" }
            $targetApp.Refresh()
            $otherApp.Refresh()
            if ($targetApp.HasExited -or $otherApp.HasExited) { throw 'helper stopped a process without proper scope' }
            Stop-Process -Id $otherApp.Id -Force
            Wait-Process -Id $otherApp.Id -ErrorAction SilentlyContinue
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./packaging/windows_installer_stop.ps1 -InstallDir $installDir -ExeName 'desktopkit-smoke.exe'
            if ($LASTEXITCODE -ne 0) { throw "confirmed-close helper failed: $LASTEXITCODE" }
            $targetApp.Refresh()
            if (-not $targetApp.HasExited) { throw 'confirmed-close helper did not stop test-owned process' }
          } finally {
            foreach ($p in @($targetApp, $otherApp)) {
              $p.Refresh()
              if (-not $p.HasExited) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
              }
            }
          }

          $restartMarker = Join-Path $installDir 'restart-smoke.txt'
          Remove-Item $restartMarker -Force -ErrorAction SilentlyContinue

          $launch = (& $installedExe '--apply-update' $setup | ConvertFrom-Json)
          if (-not $launch.InstallerPID) { throw 'updater core did not return installer PID' }
          if ($launch.Installation.Mode -ne 'user') { throw "updater core install mode was $($launch.Installation.Mode)" }
          if (-not $launch.Restart) { throw 'updater core did not request restart' }

          $deadline = (Get-Date).AddSeconds(15)
          while (-not (Test-Path $restartMarker) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (-not (Test-Path $restartMarker)) { throw 'installed application was not restarted after updater core launch' }
          Remove-Item $restartMarker -Force

          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "silent uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Milliseconds 500
          if (Test-Path (Join-Path $installDir 'desktopkit-smoke.exe')) { throw 'installed executable remained after uninstall' }

      - name: Vet
        run: go vet ./...

      - name: Linux packaging smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/packaging-smoke
          mkdir -p .tmp/packaging-smoke/dist

          go build -o .tmp/packaging-smoke/desktopkit-smoke ./cmd/desktopkit
          go run ./cmd/desktopkit icon generate             --output .tmp/packaging-smoke/icon.png             --symbol monogram             --text K

          cat > .tmp/packaging-smoke/desktopkit-smoke.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Desktop Kit Packaging Smoke
          Exec=desktopkit-smoke
          Icon=desktopkit-smoke
          Terminal=false
          Categories=Utility;
          EOF

          go run ./cmd/desktopkit package linux             --input .tmp/packaging-smoke/desktopkit-smoke             --dist .tmp/packaging-smoke/dist             --app-name desktopkit-smoke             --asset-base desktopkit-smoke-v0.0.0             --package-name desktopkit-smoke             --package-version 0.0.0             --formats raw,deb,tar.gz             --description "Desktop Kit packaging smoke"             --maintainer "Desktop Kit CI"             --depends "libgtk-3-0 | libgtk-3-0t64"             --desktop-file .tmp/packaging-smoke/desktopkit-smoke.desktop             --icon .tmp/packaging-smoke/icon.png

          test -x .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64
          tar -tzf .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.tar.gz | grep -F 'desktopkit-smoke-v0.0.0-linux-amd64/desktopkit-smoke'
          dpkg-deb --info .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.deb
          dpkg-deb --contents .tmp/packaging-smoke/dist/desktopkit-smoke-v0.0.0-linux-amd64.deb | grep -F './usr/bin/desktopkit-smoke'
          (
            cd .tmp/packaging-smoke/dist
            sha256sum --check *.sha256
          )

      - name: Linux packaging smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          printf '#!/bin/sh\necho demo\n' > "$root/demo"
          chmod +x "$root/demo"
          cat > "$root/demo.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Demo
          Exec=demo
          Icon=demo
          Categories=Utility;
          EOF
          go run ./cmd/desktopkit package linux \
            --input "$root/demo" \
            --dist "$root/dist" \
            --app-name demo \
            --asset-base demo-v1.2.3 \
            --package-name demo \
            --package-version 1.2.3 \
            --formats raw,deb,tar.gz \
            --description "Desktop Kit packaging smoke" \
            --maintainer "Desktop Kit CI" \
            --desktop-file "$root/demo.desktop"

          test -x "$root/dist/demo-v1.2.3-linux-amd64"
          tar -tzf "$root/dist/demo-v1.2.3-linux-amd64.tar.gz" | grep -F 'demo-v1.2.3-linux-amd64/demo'
          dpkg-deb --info "$root/dist/demo-v1.2.3-linux-amd64.deb"
          dpkg-deb --contents "$root/dist/demo-v1.2.3-linux-amd64.deb" | grep -F './usr/bin/demo'
          (
            cd "$root/dist"
            sha256sum --check ./*.sha256
          )

  windows-installer-workflow:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/wails-desktop.yml
    with:
      app-name: desktopkit-workflow-smoke
      desktop-dir: .github/wails-installer-smoke
      desktopkit-cli-version: ${{ github.sha }}
      build-windows: true
      build-linux: false
      build-macos: false
      windows-installer: true
      windows-install-scope: user
      windows-product-name: Desktop Kit Workflow Smoke
      windows-publisher: Desktop Kit CI
      windows-app-id: desktopkit-workflow-smoke
      test-command: ""
      vet-command: ""
      publish-release: false

  verify-windows-installer-workflow:
    if: github.event_name != 'pull_request'
    needs: windows-installer-workflow
    runs-on: windows-latest
    steps:
      - name: Download Windows workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: desktopkit-workflow-smoke-windows-amd64
          path: dist

      - name: Verify portable, setup and zip artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $portableFiles = @(Get-ChildItem dist -File -Filter 'desktopkit-workflow-smoke*-windows-amd64.exe' |
            Where-Object { $_.Name -notlike '*-setup.exe' })
          $setupFiles = @(Get-ChildItem dist -File -Filter 'desktopkit-workflow-smoke*-windows-amd64-setup.exe')
          $zipFiles = @(Get-ChildItem dist -File -Filter 'desktopkit-workflow-smoke*-windows-amd64.zip')

          if ($portableFiles.Count -ne 1) { throw "expected one portable exe, found $($portableFiles.Count)" }
          if ($setupFiles.Count -ne 1) { throw "expected one setup exe, found $($setupFiles.Count)" }
          if ($zipFiles.Count -ne 1) { throw "expected one portable zip, found $($zipFiles.Count)" }

          $portable = $portableFiles[0].FullName
          $setup = $setupFiles[0].FullName
          $zip = $zipFiles[0].FullName
          $base = [System.IO.Path]::GetFileNameWithoutExtension($portableFiles[0].Name)

          if ($setupFiles[0].Name -ne "$base-setup.exe") { throw "setup base does not match portable: $($setupFiles[0].Name)" }
          if ($zipFiles[0].Name -ne "$base.zip") { throw "zip base does not match portable: $($zipFiles[0].Name)" }

          foreach ($path in @($portable, $setup, $zip)) {
            $checksum = "$path.sha256"
            if (-not (Test-Path $checksum)) { throw "missing checksum: $checksum" }
            $expected = ((Get-Content $checksum -Raw).Trim() -split "\s+")[0]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "checksum mismatch: $path" }
          }

          $extract = Join-Path $env:RUNNER_TEMP 'desktopkit-workflow-zip-verify'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract "$base.exe"))) { throw "portable exe missing from zip" }
          if (Get-ChildItem $extract -File | Where-Object { $_.Name -like "*-setup.exe" }) { throw "setup exe must not be nested in portable zip" }
