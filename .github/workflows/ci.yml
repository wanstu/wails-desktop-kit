name: Kit CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
          - name: Linux amd64
            os: ubuntu-24.04
            go-flags: "-tags=webkit2_41"
          - name: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: ${{ matrix.go-flags }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-bin

      - name: Test
        run: go test -race -count=1 ./...

      - name: macOS Wails and tray lifecycle smoke
        if: runner.os == 'macOS'
        run: go run -tags production ./.github/smokeapp
        timeout-minutes: 2

      - name: Vet
        run: go vet ./...
