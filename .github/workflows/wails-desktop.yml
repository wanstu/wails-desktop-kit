name: Reusable Wails Desktop

on:
  workflow_call:
    inputs:
      app-name:
        description: "Output filename from wails.json, without extension"
        required: true
        type: string
      desktop-dir:
        description: "Directory containing wails.json"
        required: false
        default: "."
        type: string
      go-version-file:
        description: "Go version file relative to repository root"
        required: false
        default: "go.mod"
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      wails-version:
        required: false
        default: "v2.15.0"
        type: string
      test-command:
        required: false
        default: "go test ./..."
        type: string
      vet-command:
        required: false
        default: "go vet ./..."
        type: string
      publish-release:
        description: "Publish a GitHub Release after all platform builds"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            artifact: windows-amd64
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: linux-amd64
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ inputs.wails-version }}

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Vet
        run: ${{ inputs.vet-command }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location '${{ inputs.desktop-dir }}'
          wails build -clean

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -tags webkit2_41

      - name: Build macOS universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -platform darwin/universal

      - name: Stage Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = Join-Path '${{ inputs.desktop-dir }}' 'build/bin/${{ inputs.app-name }}.exe'
          $target = 'dist/${{ inputs.app-name }}-windows-amd64.exe'
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ inputs.app-name }}-windows-amd64.exe" | Set-Content -NoNewline "$target.sha256"

      - name: Stage Linux release files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}' 'dist/${{ inputs.app-name }}-linux-amd64'
          chmod +x 'dist/${{ inputs.app-name }}-linux-amd64'
          (
            cd dist
            sha256sum '${{ inputs.app-name }}-linux-amd64' > '${{ inputs.app-name }}-linux-amd64.sha256'
          )

      - name: Stage macOS release files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent             '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}.app'             'dist/${{ inputs.app-name }}-macos-universal.app.zip'
          (
            cd dist
            shasum -a 256 '${{ inputs.app-name }}-macos-universal.app.zip'               > '${{ inputs.app-name }}-macos-universal.app.zip.sha256'
          )

      - name: Upload platform artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.app-name }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.publish-release && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.app-name }} ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
