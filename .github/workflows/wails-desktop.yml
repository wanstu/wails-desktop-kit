name: Reusable Wails Desktop

on:
  workflow_call:
    inputs:
      app-name:
        description: "Output filename from wails.json, without extension"
        required: true
        type: string
      desktop-dir:
        description: "Directory containing wails.json"
        required: false
        default: "."
        type: string
      go-version-file:
        description: "Go version file relative to repository root"
        required: false
        default: "go.mod"
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      wails-version:
        required: false
        default: "v2.15.0"
        type: string
      desktopkit-cli-version:
        description: "Desktop Kit helper version used for package staging."
        required: false
        default: "v0.7.1"
        type: string
      test-command:
        required: false
        default: "go test ./..."
        type: string
      vet-command:
        required: false
        default: "go vet ./..."
        type: string
      build-command-windows:
        description: "Optional repository-root Windows build wrapper. Empty uses direct wails build."
        required: false
        default: ""
        type: string
      build-command-unix:
        description: "Optional repository-root Linux/macOS build wrapper. Empty uses direct wails build."
        required: false
        default: ""
        type: string
      post-package-command-windows:
        description: "Optional trusted repository-root command that can add extra Windows release files to dist/."
        required: false
        default: ""
        type: string
      post-package-command-linux:
        description: "Optional trusted repository-root command that can add extra Linux release files to dist/ (for example AppImage)."
        required: false
        default: ""
        type: string
      post-package-command-macos:
        description: "Optional trusted repository-root command that can add extra macOS release files to dist/."
        required: false
        default: ""
        type: string
      linux-package-formats:
        description: "Comma-separated built-in Linux formats: raw,deb,tar.gz."
        required: false
        default: "raw"
        type: string
      linux-package-name:
        description: "Debian package / desktop asset name. Empty derives it from app-name."
        required: false
        default: ""
        type: string
      linux-package-description:
        description: "Linux package description."
        required: false
        default: "Wails desktop application"
        type: string
      linux-package-maintainer:
        description: "Debian Maintainer field. Empty uses the GitHub repository owner."
        required: false
        default: ""
        type: string
      linux-deb-depends:
        description: "Debian Depends metadata."
        required: false
        default: "libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0"
        type: string
      linux-deb-section:
        required: false
        default: "utils"
        type: string
      linux-deb-priority:
        required: false
        default: "optional"
        type: string
      linux-desktop-file:
        description: "Optional repository-relative .desktop file included in deb/tar.gz."
        required: false
        default: ""
        type: string
      linux-icon-file:
        description: "Optional repository-relative icon included in deb/tar.gz."
        required: false
        default: ""
        type: string
      linux-deb:
        description: "Deprecated compatibility flag. true adds deb to linux-package-formats."
        required: false
        default: false
        type: boolean
      linux-deb-description:
        description: "Deprecated alias for linux-package-description; kept for existing callers."
        required: false
        default: ""
        type: string
      publish-release:
        description: "Publish a GitHub Release after all platform builds"
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            artifact: windows-amd64
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: linux-amd64
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ inputs.wails-version }}

      - name: Install Desktop Kit packaging helper
        if: runner.os == 'Linux'
        shell: bash
        run: go install github.com/wanstu/wails-desktop-kit/cmd/desktopkit@${{ inputs.desktopkit-cli-version }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Vet
        if: inputs.vet-command != ''
        run: ${{ inputs.vet-command }}

      - name: Build Windows with product wrapper
        if: runner.os == 'Windows' && inputs.build-command-windows != ''
        shell: pwsh
        run: ${{ inputs.build-command-windows }}

      - name: Build Windows
        if: runner.os == 'Windows' && inputs.build-command-windows == ''
        shell: pwsh
        run: |
          Set-Location '${{ inputs.desktop-dir }}'
          wails build -clean

      - name: Build Unix with product wrapper
        if: runner.os != 'Windows' && inputs.build-command-unix != ''
        shell: bash
        run: ${{ inputs.build-command-unix }}

      - name: Build Linux
        if: runner.os == 'Linux' && inputs.build-command-unix == ''
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -tags webkit2_41

      - name: Build macOS universal
        if: runner.os == 'macOS' && inputs.build-command-unix == ''
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -platform darwin/universal

      - name: Stage Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = Join-Path '${{ inputs.desktop-dir }}' 'build/bin/${{ inputs.app-name }}.exe'
          $assetBase = $env:APP_NAME
          if ($env:ASSET_VERSION) {
            $assetBase = "$assetBase-$($env:ASSET_VERSION)"
          }
          $target = Join-Path 'dist' "$assetBase-windows-amd64.exe"
          Copy-Item $source $target -Force

      - name: Stage Linux release files
        if: runner.os == 'Linux'
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_FORMATS: ${{ inputs.linux-package-formats }}
          LEGACY_DEB: ${{ inputs.linux-deb }}
          PACKAGE_NAME: ${{ inputs.linux-package-name }}
          PACKAGE_DESCRIPTION: ${{ inputs.linux-deb-description != '' && inputs.linux-deb-description || inputs.linux-package-description }}
          PACKAGE_MAINTAINER: ${{ inputs.linux-package-maintainer }}
          DEB_DEPENDS: ${{ inputs.linux-deb-depends }}
          DEB_SECTION: ${{ inputs.linux-deb-section }}
          DEB_PRIORITY: ${{ inputs.linux-deb-priority }}
          DESKTOP_FILE: ${{ inputs.linux-desktop-file }}
          ICON_FILE: ${{ inputs.linux-icon-file }}
        run: |
          set -euo pipefail
          asset_base="$APP_NAME"
          package_version="0.0.0~ci${GITHUB_RUN_NUMBER}"
          if [[ -n "$ASSET_VERSION" ]]; then
            asset_base="$asset_base-$ASSET_VERSION"
            package_version="${ASSET_VERSION#v}"
          fi

          formats="$PACKAGE_FORMATS"
          if [[ "$LEGACY_DEB" == "true" ]] && [[ ",$formats," != *",deb,"* ]]; then
            formats="$formats,deb"
          fi

          args=(
            package linux
            --input '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}'
            --dist dist
            --app-name "$APP_NAME"
            --asset-base "$asset_base"
            --package-version "$package_version"
            --arch amd64
            --formats "$formats"
            --description "$PACKAGE_DESCRIPTION"
            --maintainer "${PACKAGE_MAINTAINER:-$GITHUB_REPOSITORY_OWNER}"
            --depends "$DEB_DEPENDS"
            --section "$DEB_SECTION"
            --priority "$DEB_PRIORITY"
          )
          if [[ -n "$PACKAGE_NAME" ]]; then
            args+=(--package-name "$PACKAGE_NAME")
          fi
          if [[ -n "$DESKTOP_FILE" ]]; then
            args+=(--desktop-file "$DESKTOP_FILE")
          fi
          if [[ -n "$ICON_FILE" ]]; then
            args+=(--icon "$ICON_FILE")
          fi
          desktopkit "${args[@]}"

      - name: Stage macOS release files
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset_base="$APP_NAME"
          if [[ -n "$ASSET_VERSION" ]]; then
            asset_base="$asset_base-$ASSET_VERSION"
          fi
          target="$asset_base-macos-universal.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}.app' \
            "dist/$target"

      - name: Product post-package hook (Windows)
        if: runner.os == 'Windows' && inputs.post-package-command-windows != ''
        shell: pwsh
        run: ${{ inputs.post-package-command-windows }}

      - name: Product post-package hook (Linux)
        if: runner.os == 'Linux' && inputs.post-package-command-linux != ''
        shell: bash
        run: ${{ inputs.post-package-command-linux }}

      - name: Product post-package hook (macOS)
        if: runner.os == 'macOS' && inputs.post-package-command-macos != ''
        shell: bash
        run: ${{ inputs.post-package-command-macos }}

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*.sha256' }
          if (-not $files) { throw 'No release files found in dist/' }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content -NoNewline "$($file.FullName).sha256"
          }

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for path in dist/*; do
            [[ -f "$path" ]] || continue
            [[ "$path" == *.sha256 ]] && continue
            found=1
            file="$(basename "$path")"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              (cd dist && shasum -a 256 "$file" > "$file.sha256")
            else
              (cd dist && sha256sum "$file" > "$file.sha256")
            fi
          done
          if [[ "$found" != "1" ]]; then
            echo "No release files found in dist/" >&2
            exit 1
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.app-name }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.publish-release && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-windows-amd64
          path: dist

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-linux-amd64
          path: dist

      - name: Download macos-universal artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-macos-universal
          path: dist

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(dist/*.sha256)
          if (( ${#checksums[@]} == 0 )); then
            echo "No checksums found in downloaded platform artifacts" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (
              cd dist
              sha256sum --check "$(basename "$checksum")"
            )
          done

          files=(dist/*)
          release_files=0
          for file in "${files[@]}"; do
            [[ "$file" == *.sha256 ]] && continue
            [[ -s "$file" ]] || { echo "Empty release file: $file" >&2; exit 1; }
            release_files=$((release_files + 1))
          done
          if (( release_files < 3 )); then
            echo "Expected at least one release file from each platform, got $release_files" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.app-name }} ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
