name: Reusable Wails Desktop

on:
  workflow_call:
    inputs:
      app-name:
        description: "Output filename from wails.json, without extension"
        required: true
        type: string
      desktop-dir:
        description: "Directory containing wails.json"
        required: false
        default: "."
        type: string
      go-version-file:
        description: "Go version file relative to repository root"
        required: false
        default: "go.mod"
        type: string
      node-version:
        required: false
        default: "24"
        type: string
      wails-version:
        required: false
        default: "v2.15.0"
        type: string
      test-command:
        required: false
        default: "go test ./..."
        type: string
      vet-command:
        required: false
        default: "go vet ./..."
        type: string
      build-command-windows:
        description: "Optional repository-root Windows build wrapper. Empty uses direct wails build."
        required: false
        default: ""
        type: string
      build-command-unix:
        description: "Optional repository-root Linux/macOS build wrapper. Empty uses direct wails build."
        required: false
        default: ""
        type: string
      linux-deb:
        description: "Also package the Linux amd64 binary as a Debian .deb artifact."
        required: false
        default: false
        type: boolean
      linux-deb-description:
        description: "Description written to the Debian control metadata."
        required: false
        default: "Wails desktop application"
        type: string
      publish-release:
        description: "Publish a GitHub Release after all platform builds"
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            artifact: windows-amd64
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: linux-amd64
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ inputs.wails-version }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Vet
        if: inputs.vet-command != ''
        run: ${{ inputs.vet-command }}

      - name: Build Windows with product wrapper
        if: runner.os == 'Windows' && inputs.build-command-windows != ''
        shell: pwsh
        run: ${{ inputs.build-command-windows }}

      - name: Build Windows
        if: runner.os == 'Windows' && inputs.build-command-windows == ''
        shell: pwsh
        run: |
          Set-Location '${{ inputs.desktop-dir }}'
          wails build -clean

      - name: Build Unix with product wrapper
        if: runner.os != 'Windows' && inputs.build-command-unix != ''
        shell: bash
        run: ${{ inputs.build-command-unix }}

      - name: Build Linux
        if: runner.os == 'Linux' && inputs.build-command-unix == ''
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -tags webkit2_41

      - name: Build macOS universal
        if: runner.os == 'macOS' && inputs.build-command-unix == ''
        shell: bash
        run: |
          cd '${{ inputs.desktop-dir }}'
          wails build -clean -platform darwin/universal

      - name: Stage Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = Join-Path '${{ inputs.desktop-dir }}' 'build/bin/${{ inputs.app-name }}.exe'
          $assetBase = $env:APP_NAME
          if ($env:ASSET_VERSION) {
            $assetBase = "$assetBase-$($env:ASSET_VERSION)"
          }
          $targetName = "$assetBase-windows-amd64.exe"
          $target = Join-Path 'dist' $targetName
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $targetName" | Set-Content -NoNewline "$target.sha256"

      - name: Stage Linux release files
        if: runner.os == 'Linux'
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset_base="$APP_NAME"
          if [[ -n "$ASSET_VERSION" ]]; then
            asset_base="$asset_base-$ASSET_VERSION"
          fi
          target="$asset_base-linux-amd64"
          cp '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}' "dist/$target"
          chmod +x "dist/$target"
          (
            cd dist
            sha256sum "$target" > "$target.sha256"
          )

          if [[ '${{ inputs.linux-deb }}' == 'true' ]]; then
            package_name="$(printf '%s' "$APP_NAME" | tr '[:upper:]_' '[:lower:]-')"
            if [[ ! "$package_name" =~ ^[a-z0-9][a-z0-9+.-]+$ ]]; then
              echo "Invalid Debian package name derived from app-name: $package_name" >&2
              exit 1
            fi

            if [[ -n "$ASSET_VERSION" ]]; then
              package_version="${ASSET_VERSION#v}"
            else
              package_version="0.0.0~ci${GITHUB_RUN_NUMBER}"
            fi

            deb_root="$(mktemp -d)"
            trap 'rm -rf "$deb_root"' EXIT
            install -Dm755 "dist/$target" "$deb_root/usr/bin/$APP_NAME"
            mkdir -p "$deb_root/DEBIAN"
            cat > "$deb_root/DEBIAN/control" <<EOF
Package: $package_name
Version: $package_version
Section: utils
Priority: optional
Architecture: amd64
Maintainer: ${GITHUB_REPOSITORY_OWNER}
Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0
Description: ${{ inputs.linux-deb-description }}
EOF

            deb_target="$asset_base-linux-amd64.deb"
            dpkg-deb --build --root-owner-group "$deb_root" "dist/$deb_target"
            (
              cd dist
              sha256sum "$deb_target" > "$deb_target.sha256"
            )
          fi

      - name: Stage macOS release files
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset_base="$APP_NAME"
          if [[ -n "$ASSET_VERSION" ]]; then
            asset_base="$asset_base-$ASSET_VERSION"
          fi
          target="$asset_base-macos-universal.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            '${{ inputs.desktop-dir }}/build/bin/${{ inputs.app-name }}.app' \
            "dist/$target"
          (
            cd dist
            shasum -a 256 "$target" > "$target.sha256"
          )

      - name: Upload platform artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.app-name }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.publish-release && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-windows-amd64
          path: dist

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-linux-amd64
          path: dist

      - name: Download macos-universal artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-name }}-macos-universal
          path: dist

      - name: Verify platform release files
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          ASSET_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          asset_base="$APP_NAME-$ASSET_VERSION"
          files=(
            "$asset_base-windows-amd64.exe"
            "$asset_base-linux-amd64"
            "$asset_base-macos-universal.app.zip"
          )
          if [[ '${{ inputs.linux-deb }}' == 'true' ]]; then
            files+=("$asset_base-linux-amd64.deb")
          fi
          for file in "${files[@]}"; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum --check "$file.sha256"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.app-name }} ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
